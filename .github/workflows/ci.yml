name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Local and CI run as a preview: Cloudflare's published Turnstile test keys, no real secrets.
      APP_ENV: preview
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NEXT_TELEMETRY_DISABLED: "1"
      # Workers Free plan limits (spec 0001): compressed 3 MiB, uncompressed 64 MiB.
      WORKER_GZIP_LIMIT_KIB: "3072"
      WORKER_RAW_LIMIT_KIB: "65536"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # no job here pushes

      - uses: pnpm/action-setup@v6 # version comes from package.json packageManager

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # The schema and the committed migrations must agree: generating again changes nothing.
      - name: Migration drift check
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::drizzle/ changed after db:generate. Commit the generated migration."
            git status --porcelain -- drizzle
            exit 1
          fi

      - name: Migrate local D1
        run: pnpm db:migrate:local

      - name: Unit tests
        run: pnpm test

      - name: Local Worker vars (test values only)
        run: cp .dev.vars.example .dev.vars

      - name: OpenNext build
        run: pnpm build:worker

      # Uses the committed database_id values; local mode never contacts them.
      - name: Worker size gate
        run: |
          out="$(pnpm exec wrangler deploy --dry-run --outdir dist-check 2>&1)"
          echo "$out"
          line="$(printf '%s\n' "$out" | grep -E 'Total Upload:.*gzip:' | tail -1)"
          [ -n "$line" ] || { echo "::error::Could not read the Worker size from wrangler"; exit 1; }
          to_kib() { awk -v v="$1" -v u="$2" 'BEGIN { printf "%.2f", (u == "MiB" ? v * 1024 : v) }'; }
          raw="$(to_kib "$(printf '%s' "$line" | sed -E 's/.*Total Upload: ([0-9.]+) ([KM]iB).*/\1/')" "$(printf '%s' "$line" | sed -E 's/.*Total Upload: ([0-9.]+) ([KM]iB).*/\2/')")"
          gzip="$(to_kib "$(printf '%s' "$line" | sed -E 's/.*gzip: ([0-9.]+) ([KM]iB).*/\1/')" "$(printf '%s' "$line" | sed -E 's/.*gzip: ([0-9.]+) ([KM]iB).*/\2/')")"
          echo "### Worker size: ${raw} KiB raw (limit ${WORKER_RAW_LIMIT_KIB}), ${gzip} KiB gzipped (limit ${WORKER_GZIP_LIMIT_KIB})" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker size: ${raw} KiB raw, ${gzip} KiB gzipped"
          if awk -v k="$gzip" -v l="$WORKER_GZIP_LIMIT_KIB" 'BEGIN { exit !(k > l) }'; then
            echo "::error::Gzipped Worker is ${gzip} KiB, over the ${WORKER_GZIP_LIMIT_KIB} KiB Workers Free plan limit"
            exit 1
          fi
          if awk -v k="$raw" -v l="$WORKER_RAW_LIMIT_KIB" 'BEGIN { exit !(k > l) }'; then
            echo "::error::Raw Worker is ${raw} KiB, over the ${WORKER_RAW_LIMIT_KIB} KiB limit"
            exit 1
          fi

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End to end tests (pnpm preview, Workers runtime, fresh local D1)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
